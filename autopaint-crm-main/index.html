    <script>
      // Protection for sandboxed iframe environments where window.fetch is configured with only a getter
      (function() {
        try {
          var originalDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!originalDesc) {
            var proto = Object.getPrototypeOf(window);
            while (proto && !originalDesc) {
              originalDesc = Object.getOwnPropertyDescriptor(proto, 'fetch');
              proto = Object.getPrototypeOf(proto);
            }
          }

          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var customFetch = nativeFetch;

          // If fetch has a getter without a setter or is non-writable, redefine with both getter and setter
          if (!originalDesc || !originalDesc.set) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return customFetch || nativeFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e1) {
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return customFetch || nativeFetch;
                    },
                    set: function(val) {
                      customFetch = val;
                    },
                    configurable: true,
                    enumerable: true,
                  });
                }
              } catch (e2) {}
            }
          }
        } catch (e) {}

        // Global error guard to catch and suppress any unhandled "Cannot set property fetch" errors
        window.addEventListener(
          'error',
          function(e) {
            var msg = (e && e.message) || (e && e.error && e.error.message) || '';
            if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('only a getter') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
